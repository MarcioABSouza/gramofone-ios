name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA (sem assinatura)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto
        run: xcodegen generate

      - name: Build (Release, device, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project Gramofone.xcodeproj \
            -scheme Gramofone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Conferir alvo mínimo
        run: |
          APP="build/Build/Products/Release-iphoneos/Gramofone.app"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Empacotar .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/Gramofone.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Gramofone.ipa Payload
          ls -lh Gramofone.ipa

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Gramofone-ipa
          path: Gramofone.ipa
          retention-days: 30
          if-no-files-found: error
